name: Render Instagram infographic
on:
  push:
    branches: [main]
    paths:
      - 'instagram_visual_*.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render SVG to PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for path in sorted(Path('.').glob('instagram_visual_*.svg')):
              target = path.with_suffix('.png')
              cairosvg.svg2png(url=str(path),write_to=str(target),output_width=1080,output_height=1350)
              print(f'Rendered {target}')
          PY
      - name: Commit rendered PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram_visual_*.png
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Render Instagram infographic PNG"
            git push
          fi
