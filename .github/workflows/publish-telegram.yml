name: Publish Telegram post

on:
  push:
    branches: [main]
    paths:
      - telegram_post.txt
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1001702231808"
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          if not token:
              raise SystemExit("Repository secret TELEGRAM_BOT_TOKEN is not configured")

          with open("telegram_post.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()

          if not text:
              raise SystemExit("telegram_post.txt is empty")

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "false",
          }).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read().decode("utf-8", errors="replace")
              print(body)
          PY
