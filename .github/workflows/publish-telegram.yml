name: Publish Telegram post

on:
  push:
    branches: [main]
    paths:
      - telegram_post.json
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render visual and publish or edit Telegram post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1001702231808"
        run: |
          python -m pip install pillow
          python - <<'PY'
          import json, os, textwrap
          from PIL import Image, ImageDraw, ImageFont

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("Repository secret TELEGRAM_BOT_TOKEN is not configured")

          with open("telegram_post.json", "r", encoding="utf-8") as f:
              payload = json.load(f)

          text = str(payload.get("text", "")).strip()
          visual = payload.get("visual") or {}
          edit_message_id = payload.get("edit_message_id")

          if not text:
              raise SystemExit("telegram_post.json text is empty")
          if len(text) > 1000:
              raise SystemExit("Telegram caption is too long; keep text at 1000 characters or less")

          W, H = 1200, 628
          img = Image.new("RGB", (W, H), (247, 247, 244))
          d = ImageDraw.Draw(img)

          def font(size, bold=False):
              path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              return ImageFont.truetype(path, size)

          def wrap(s, width):
              return textwrap.wrap(str(s), width=width, break_long_words=False)

          d.rectangle((0, 0, W, 18), fill=(25, 25, 25))
          d.text((60, 44), "КОНТРОЛЬ СНАБЖЕНИЯ", font=font(24, True), fill=(40, 40, 40))

          title = str(visual.get("title", "")).strip()
          subtitle = str(visual.get("subtitle", "")).strip()
          y = 105
          for line in wrap(title, 34)[:3]:
              d.text((60, y), line, font=font(48, True), fill=(15, 15, 15))
              y += 58
          if subtitle:
              y += 8
              for line in wrap(subtitle, 62)[:2]:
                  d.text((60, y), line, font=font(24), fill=(80, 80, 80))
                  y += 34

          vtype = str(visual.get("type", "flow")).lower()
          items = visual.get("items") or []
          area_top = max(y + 24, 300)

          if vtype == "metric":
              big = str(visual.get("big_number", ""))
              label = str(visual.get("label", ""))
              d.text((60, area_top), big, font=font(92, True), fill=(20, 20, 20))
              for i, line in enumerate(wrap(label, 46)[:3]):
                  d.text((60, area_top + 115 + i * 34), line, font=font(28), fill=(70, 70, 70))

          elif vtype == "comparison":
              left_title = str(visual.get("left_title", "Подход 1"))
              right_title = str(visual.get("right_title", "Подход 2"))
              left_items = visual.get("left_items") or []
              right_items = visual.get("right_items") or []
              x1, x2 = 60, 630
              d.rounded_rectangle((x1, area_top, x1 + 500, H - 55), radius=24, outline=(150, 150, 145), width=2)
              d.rounded_rectangle((x2, area_top, x2 + 500, H - 55), radius=24, outline=(150, 150, 145), width=2)
              d.text((x1 + 28, area_top + 24), left_title, font=font(28, True), fill=(25, 25, 25))
              d.text((x2 + 28, area_top + 24), right_title, font=font(28, True), fill=(25, 25, 25))
              for colx, vals in [(x1, left_items), (x2, right_items)]:
                  yy = area_top + 78
                  for item in vals[:4]:
                      for line in wrap("• " + str(item), 32)[:2]:
                          d.text((colx + 28, yy), line, font=font(22), fill=(55, 55, 55))
                          yy += 29
                      yy += 10

          elif vtype == "bars":
              vals = []
              for it in items[:5]:
                  if isinstance(it, dict):
                      try:
                          val = float(it.get("value", 0))
                      except Exception:
                          val = 0
                      vals.append((str(it.get("label", "")), val, str(it.get("suffix", ""))))
              maxv = max([v for _, v, _ in vals], default=1) or 1
              yy = area_top
              for label, val, suffix in vals:
                  d.text((60, yy), label, font=font(22, True), fill=(35, 35, 35))
                  bx, by, bw, bh = 390, yy + 2, 650, 26
                  d.rounded_rectangle((bx, by, bx + bw, by + bh), radius=13, fill=(220, 220, 215))
                  fillw = max(8, int(bw * val / maxv))
                  d.rounded_rectangle((bx, by, bx + fillw, by + bh), radius=13, fill=(65, 65, 65))
                  d.text((1060, yy - 2), f"{val:g}{suffix}", font=font(22, True), fill=(35, 35, 35), anchor="ra")
                  yy += 58

          else:
              n = max(1, min(len(items), 5))
              boxw = 200 if n >= 5 else (250 if n >= 4 else 310)
              gap = 22 if n >= 5 else 28
              total = n * boxw + (n - 1) * gap
              start = (W - total) // 2
              yy = area_top
              for idx, item in enumerate(items[:5]):
                  x = start + idx * (boxw + gap)
                  d.rounded_rectangle((x, yy, x + boxw, yy + 170), radius=22, fill=(235, 235, 231), outline=(165, 165, 160), width=2)
                  d.text((x + 16, yy + 16), f"{idx + 1:02d}", font=font(22, True), fill=(90, 90, 90))
                  ty = yy + 54
                  wrap_width = 14 if n >= 5 else 18
                  for line in wrap(str(item), wrap_width)[:4]:
                      d.text((x + 16, ty), line, font=font(19 if n >= 5 else 21, True), fill=(30, 30, 30))
                      ty += 26 if n >= 5 else 28
                  if idx < n - 1:
                      ax = x + boxw + 6
                      ay = yy + 85
                      d.line((ax, ay, ax + gap - 12, ay), fill=(80, 80, 80), width=3)
                      d.polygon([(ax + gap - 12, ay), (ax + gap - 20, ay - 6), (ax + gap - 20, ay + 6)], fill=(80, 80, 80))

          d.text((1140, 592), "контроль-снабжения.рф", font=font(18), fill=(100, 100, 100), anchor="ra")
          img.save("telegram_visual.png", "PNG")

          with open("telegram_caption.txt", "w", encoding="utf-8") as f:
              f.write(text)
          with open("telegram_edit_id.txt", "w", encoding="utf-8") as f:
              f.write("" if edit_message_id in (None, "") else str(edit_message_id))
          PY

          if [ -s telegram_edit_id.txt ]; then
            MESSAGE_ID="$(cat telegram_edit_id.txt)"
            MEDIA_JSON="$(python - <<'PY'
          import json
          with open("telegram_caption.txt", "r", encoding="utf-8") as f:
              caption = f.read()
          print(json.dumps({"type":"photo","media":"attach://photo","caption":caption}, ensure_ascii=False))
          PY
          )"
            curl --fail --silent --show-error               -F "chat_id=$TELEGRAM_CHAT_ID"               -F "message_id=$MESSAGE_ID"               -F "media=$MEDIA_JSON"               -F "photo=@telegram_visual.png"               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/editMessageMedia"
          else
            curl --fail --silent --show-error               -F "chat_id=$TELEGRAM_CHAT_ID"               -F "photo=@telegram_visual.png"               -F "caption=<telegram_caption.txt"               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendPhoto"
          fi
