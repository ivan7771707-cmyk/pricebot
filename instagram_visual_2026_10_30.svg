<text x="69" y="453" fill="#c5d3de" font-family="DejaVu Sans" font-size="29">Правительство призвало металлургов</text>
<text x="69" y="497" fill="#c5d3de" font-family="DejaVu Sans" font-size="29">держать критически важные комплектующие</text>
