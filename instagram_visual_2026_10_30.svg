<text x="200" y="1018" fill="#ffffff" font-family="DejaVu Sans" font-size="31" font-weight="bold">Сколько стоит остановка?</text>
<text x="200" y="1059" fill="#b7c9d3" font-family="DejaVu Sans" font-size="24">Сравнить ущерб и стоимость запаса</text>
<text x="68" y="1206" fill="#e2edf2" font-family="DejaVu Sans" font-size="27" font-weight="bold">Решение зависит от экономики простоя</text>
