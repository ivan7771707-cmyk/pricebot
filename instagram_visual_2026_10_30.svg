<text x="104" y="631" fill="#f4bd58" font-family="DejaVu Sans" font-size="30" font-weight="bold">ТРИ ВОПРОСА К ЗАКУПКАМ</text>
<circle cx="132" cy="729" r="35" fill="#f4bd58"/><text x="132" y="742" fill="#172c3a" text-anchor="middle" font-family="DejaVu Sans" font-size="33" font-weight="bold">1</text>
<text x="200" y="722" fill="#ffffff" font-family="DejaVu Sans" font-size="31" font-weight="bold">Какие детали критичны?</text>
<text x="200" y="764" fill="#b7c9d3" font-family="DejaVu Sans" font-size="24">Без них оборудование остановится</text>
