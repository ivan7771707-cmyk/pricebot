<text x="70" y="205" fill="#f4bd58" font-family="DejaVu Sans" font-size="24" font-weight="bold" letter-spacing="1">ПРОМЫШЛЕННОСТЬ / 29.10.2026</text>
<text x="66" y="300" fill="#ffffff" font-family="DejaVu Sans" font-size="74" font-weight="bold">ЗАПАСЫ</text>
