<circle cx="132" cy="877" r="35" fill="#f4bd58"/><text x="132" y="889" fill="#172c3a" text-anchor="middle" font-family="DejaVu Sans" font-size="33" font-weight="bold">2</text>
<text x="200" y="869" fill="#ffffff" font-family="DejaVu Sans" font-size="31" font-weight="bold">Как быстро их привезут?</text>
<text x="200" y="910" fill="#b7c9d3" font-family="DejaVu Sans" font-size="24">Срок поставки, наличие, аналоги</text>
